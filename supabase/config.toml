# Disposable local development only; no hosted project reference or credentials.
project_id = "juvanga-local"

[api]
enabled = true
port = 56321
schemas = ["app"]
extra_search_path = ["app", "extensions"]
max_rows = 100

[db]
port = 56322
shadow_port = 56320
major_version = 17
health_timeout = "5m"

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true

[auth.sms]
enable_signup = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
